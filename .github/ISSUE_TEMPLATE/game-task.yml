name: Game development task
description: Request a feature or report a problem from your phone.
title: "[Game] "
body:
  - type: textarea
    id: request
    attributes:
      label: สิ่งที่อยากให้ทำ
      description: บอกสิ่งที่ต้องการให้เกิดขึ้นในเกม เขียนภาษาไทยได้
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: รายละเอียดหรือภาพตัวอย่าง
      description: สำหรับบั๊ก ระบุหน้าจอ ขั้นตอน และรุ่นมือถือ
  - type: checkboxes
    id: constraints
    attributes:
      label: หลักการของเกม
      options:
        - label: รักษาเซฟเดิมและระบบซื้อฮีโร่โดยตรง / สุ่มเฉพาะอุปกรณ์
          required: true
